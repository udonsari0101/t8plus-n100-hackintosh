<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Firebat T8 Plus — macOS Sonoma on Intel N100</title>
  <desc id="d">A sanitized, reproducible OpenCore EFI baseline for the Firebat T8 Plus (Intel N100) running macOS Sonoma 14.8.7 on OpenCore 1.0.7, with firmware GOP display.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0c1526"/>
      <stop offset="1" stop-color="#081020"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#0ea5b7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0ea5b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#1f2b44" stroke-width="1"/>

  <!-- subtle circuit traces (right field) -->
  <g stroke="#1c3a52" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M760 96 H905 a10 10 0 0 1 10 10 V150"/>
    <path d="M745 150 H860"/>
    <path d="M770 210 H900 a10 10 0 0 0 10 -10 V176"/>
    <path d="M980 120 H1120"/>
    <path d="M980 230 H1090 a10 10 0 0 0 10 -10 V150"/>
  </g>
  <g fill="#22d3ee" opacity="0.7">
    <circle cx="745" cy="150" r="3"/><circle cx="760" cy="96" r="3"/>
    <circle cx="770" cy="210" r="3"/><circle cx="1120" cy="120" r="3"/>
    <circle cx="1090" cy="230" r="3"/>
  </g>

  <!-- chip die + display glyph (right) -->
  <g transform="translate(905 92)">
    <g stroke="#2b3f63" stroke-width="2">
      <line x1="40" y1="-12" x2="40" y2="4"/><line x1="76" y1="-12" x2="76" y2="4"/><line x1="112" y1="-12" x2="112" y2="4"/>
      <line x1="40" y1="152" x2="40" y2="168"/><line x1="76" y1="152" x2="76" y2="168"/><line x1="112" y1="152" x2="112" y2="168"/>
      <line x1="-12" y1="48" x2="4" y2="48"/><line x1="-12" y1="78" x2="4" y2="78"/><line x1="-12" y1="108" x2="4" y2="108"/>
      <line x1="148" y1="48" x2="164" y2="48"/><line x1="148" y1="78" x2="164" y2="78"/><line x1="148" y1="108" x2="164" y2="108"/>
    </g>
    <rect x="4" y="4" width="144" height="144" rx="16" fill="#0f1a30" stroke="#33507e" stroke-width="2"/>
    <rect x="30" y="30" width="92" height="92" rx="8" fill="#0b1426" stroke="url(#cyan)" stroke-width="2"/>
    <text x="76" y="83" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#e6edf3">N100</text>
    <text x="76" y="103" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7fd7ef">8086:46D1</text>
  </g>

  <!-- title block (left) -->
  <rect x="64" y="104" width="4" height="132" rx="2" fill="url(#cyan)"/>
  <text x="92" y="132" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3" fill="#7fd7ef">OPENCORE&#160;&#160;EFI&#160;&#160;BASELINE</text>
  <text x="90" y="186" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#e6edf3">Firebat T8 Plus</text>
  <text x="92" y="224" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#9fb3c8">macOS Sonoma on Intel N100</text>
  <text x="92" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b8299">Sonoma 14.8.7 · 23J520   ·   OpenCore 1.0.7   ·   firmware GOP display</text>
</svg>
