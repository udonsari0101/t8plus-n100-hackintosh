<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="mt md">
  <title id="mt">Firebat T8 Plus N100 project mark</title>
  <desc id="md">A minimalist chip glyph in cyan on dark graphite — the identity mark for the Firebat T8 Plus / Intel N100 macOS OpenCore baseline.</desc>
  <defs>
    <linearGradient id="mc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="#0b1426" stroke="#1f2b44" stroke-width="2"/>
  <g stroke="#2b3f63" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="16" x2="48" y2="30"/><line x1="80" y1="16" x2="80" y2="30"/>
    <line x1="48" y1="98" x2="48" y2="112"/><line x1="80" y1="98" x2="80" y2="112"/>
    <line x1="16" y1="48" x2="30" y2="48"/><line x1="16" y1="80" x2="30" y2="80"/>
    <line x1="98" y1="48" x2="112" y2="48"/><line x1="98" y1="80" x2="112" y2="80"/>
  </g>
  <rect x="30" y="30" width="68" height="68" rx="12" fill="#0f1a30" stroke="#33507e" stroke-width="2.5"/>
  <rect x="46" y="46" width="36" height="36" rx="7" fill="none" stroke="url(#mc)" stroke-width="3"/>
  <circle cx="64" cy="64" r="5.5" fill="url(#mc)"/>
</svg>
